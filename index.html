<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#713E35">
<title>Mis viajes</title>
<link rel="manifest" href="mis-viajes.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Marcellus&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>

<!-- ============ ACCESO (mecanismo reutilizado de las demas aplicaciones) ============ -->
<section id="vistaInicio" class="acceso">
  <div class="sello"><span>Mis</span><span>viajes</span></div>
  <h1>Mis viajes</h1>
  <p id="inicioMensaje">Abriendo...</p>
</section>

<section id="vistaGoogle" class="acceso oculto">
  <div class="sello"><span>Mis</span><span>viajes</span></div>
  <h1>Mis viajes</h1>
  <p>Inicie sesión con su cuenta de Google. Solo se pide la primera vez en cada dispositivo.</p>
  <div id="botonGoogle"></div>
  <div id="googleMensaje" class="aviso oculto"></div>
</section>

<section id="vistaPin" class="acceso oculto">
  <div class="sello"><span>Mis</span><span>viajes</span></div>
  <h1 id="pinTitulo">Ingrese su PIN</h1>
  <p id="pinTexto">Clave de acceso de 7 dígitos.</p>
  <div id="puntos" class="puntos"></div>
  <div id="pinMensaje" role="alert"></div>
  <div id="teclado" class="teclado"></div>
  <button id="btnOtraCuenta" class="enlace" type="button">Entrar con otra cuenta de Google</button>
</section>

<!-- ============ APLICACION (las pantallas las dibuja vistas.js) ============ -->
<section id="vistaApp" class="oculto">
  <div id="franja" class="franja oculto" role="status"></div>
  <div id="contenido"></div>
</section>

</main>

<nav id="navegacion" class="navegacion oculto" aria-label="Secciones">
  <button type="button" data-ir="inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Inicio</span>
  </button>
  <button type="button" data-ir="viajes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="11" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 16.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Viajes</span>
  </button>
  <button type="button" data-ir="lugares">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-6.2-5.8-6.2-10.4a6.2 6.2 0 0 1 12.4 0c0 4.6-6.2 10.4-6.2 10.4z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>Lugares</span>
  </button>
  <button type="button" data-ir="archivos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>Documentos</span><b id="cuentaDocs" class="punto oculto"></b>
  </button>
</nav>

<div id="cargando" class="cargando oculto"><div class="girador"></div></div>

<script src="config.js"></script>
<script src="almacen.js"></script>
<script src="datos.js"></script>
<script src="recordatorios.js"></script>
<script src="interprete.js"></script>
<script src="vistas.js"></script>
<script src="acceso.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
